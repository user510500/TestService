# 一键启动整个 ERP 系统
# 用法：docker-compose up -d --build
# 停止：docker-compose down
# 看日志：docker-compose logs -f
#
# 注意：去掉了 healthcheck + condition: service_healthy
# 因为容器镜像中 wget/curl 等命令不一定可用，导致健康检查一直失败
# 改用更简单的"启动即可"模式，应用层自己做重试

services:
  # ========== 反向代理（唯一对外端口）==========
  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    ports:
      - "18080:80"                          # ← 只暴露这一个端口
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - testservice
    networks:
      - app-net
    restart: unless-stopped

  # ========== 业务服务（不暴露端口）==========
  testservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_testservice
    environment:
      # 配置覆盖：appsettings.json 中的所有值都可以用环境变量覆盖
      # 命名规则：Section__Key → appsettings.json 中的 Section:Key

      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000

      # MySQL
      ConnectionStrings__MySql: "server=mysql;port=3306;database=testservice;user=root;password=root123;CharacterSet=utf8mb4;SslMode=None;AllowPublicKeyRetrieval=true;"

      # Redis
      Redis__ConnectionString: "redis:6379,password=,abortConnect=false"
      Redis__Prefix: "TestService:Prod:"

      # RabbitMQ
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      RabbitMQ__VirtualHost: "/"
      RabbitMQ__EnableConsumer: "true"

      # JWT
      Jwt__Issuer: "TestService"
      Jwt__Audience: "TestService.Client"
      Jwt__Secret: "test-service-production-secret-key-please-change-me-32+chars"
      Jwt__ExpiresMinutes: "480"

    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - app-net
    # 注意：没有 ports 段 → 不暴露端口到宿主机
    # 外部只能通过 nginx 访问
    restart: unless-stopped

  # ========== MySQL（数据持久化）==========
  mysql:
    image: mysql:8
    container_name: erp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: testservice
    volumes:
      - mysql_data:/var/lib/mysql           # 数据持久化
    networks:
      - app-net
    # 不暴露端口（应用通过容器名访问）
    restart: unless-stopped

  # ========== Redis（缓存）==========
  redis:
    image: redis:7
    container_name: erp_redis
    networks:
      - app-net
    restart: unless-stopped

  # ========== RabbitMQ（消息队列）==========
  rabbitmq:
    image: rabbitmq:3-management
    container_name: erp_rabbitmq
    networks:
      - app-net
    # 内部访问管理 UI（如需）可加：
    # ports:
    #   - "15672:15672"
    restart: unless-stopped

# ========== 网络定义 ==========
networks:
  app-net:
    driver: bridge

# ========== 数据卷定义 ==========
volumes:
  mysql_data:                                # MySQL 数据持久化到宿主机
